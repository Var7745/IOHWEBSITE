<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="iohGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0b1329" />
  <circle cx="50" cy="50" r="38" stroke="url(#iohGrad)" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="8 6" />
  
  <!-- Central Tech Hexagon & Rover/Robot Icon -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" stroke="url(#iohGrad)" stroke-width="3.5" fill="#0f1f38" />
  
  <!-- Circuit Nodes -->
  <circle cx="50" cy="34" r="3.5" fill="#38bdf8" />
  <circle cx="64" cy="58" r="3.5" fill="#22c55e" />
  <circle cx="36" cy="58" r="3.5" fill="#22c55e" />
  <line x1="50" y1="34" x2="64" y2="58" stroke="#38bdf8" stroke-width="2" />
  <line x1="50" y1="34" x2="36" y2="58" stroke="#38bdf8" stroke-width="2" />
  <line x1="36" y1="58" x2="64" y2="58" stroke="#22c55e" stroke-width="2" />
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="url(#glow)" />
</svg>